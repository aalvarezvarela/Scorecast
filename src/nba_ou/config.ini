; What tonight's intermediate rows a slot predicts from (scripts/
; predict_nba_games.py --intermediate-input overrides it per run):
;     latest  the slots in LATEST_INPUT_SLOTS read each game's latest snapshot,
;             the run's own moment, limited to what their training rows carried
;             (nba_ou.prediction.input_limits); the others their own snapshot.
;     own     every slot reads the row of its own snapshot, e.g. a run after
;             every game has tipped, so each snapshot is strictly the past.
INTERMEDIATE_INPUT_MODE = latest
; all, or rows as in ENABLED_MODELS.
LATEST_INPUT_SLOTS = all
; Intermediate slots of this horizon (minutes before tip) or shorter skip a
; game until both teams' injury reports are filed: their training rows almost
; always had them (nba_ou.prediction.report_requirement). Closing slots always
; skip such games. Empty: no intermediate slot skips.
REPORT_REQUIRED_MAX_HORIZON = 300

[Schedule]
; The daily cron-job.org jobs (scripts/cronjobs/setup_cronjobs.py), HH:MM in
; TIMEZONE. A change takes effect once setup_cronjobs.py --apply has run; the
; snapshot-time runs are then booked by SCHEDULE_PREDICTIONS_AT from the day's
; games. SCHEDULE_PREDICTIONS_AT must fall after US/Pacific midnight all year
; (09:00 Madrid or later), when the game date is already the predictor's.
; Switching the jobs off is not done here: see the repository variables
; DAILY_UPDATE_ENABLED and PREDICTIONS_ENABLED (docs/serving/snapshot_triggers.md).
TIMEZONE = Europe/Madrid
; Database update, then on a game day refit, smoke test and promotion.
UPDATE_AND_RETRAIN_AT = 08:00
; Books the day's predictor, TabPFN, past-snapshot and final-score runs.
SCHEDULE_PREDICTIONS_AT = 09:35

[Scraping]
HEADLESS = True
