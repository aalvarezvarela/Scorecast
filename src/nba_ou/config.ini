[PredictionModels]
; One row per promoted slot:
;     schema_version | target | horizon_minutes | variant
; target is line_error | total_points | spread_error.
; horizon_minutes is minutes BEFORE tip-off (0 = closing), or tpool for a
; model trained across every snapshot at once.
; variant may be omitted and defaults to main.
;
; An empty table means nothing has been promoted yet, which is a valid state:
; the daily jobs treat it as nothing to do. Rows are added by
;     python -m training_pipeline.promote <run_dir> --to-s3
; which prints the row to paste here.
ENABLED_MODELS =
    2_5 | line_error | 0 | main
    2_5 | total_points | 0 | main
    2_5 | spread_error | 0 | main
    ; Intermediate slots: served daily from tonight's live snapshot rows, every
    ; horizon on every run (see nba_ou.prediction.intermediate_frame). Not
    ; refitted daily yet: they keep their promoted build.
