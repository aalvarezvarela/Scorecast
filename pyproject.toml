[tool.poetry]
name = "nba_over_under_predictor"
version = "0.1.0"
description = "NBA over/under prediction project."
authors = ["Adrian Alvarez"]
packages = [
  { include = "nba_ou", from = "src" },
  { include = "training_pipeline" },
]

# Dependencies are split by job. The main group is what every job needs; each
# GitHub Actions workflow installs main plus the groups it uses, from a
# requirements file exported into requirements/ (see requirements/README.md).
# A plain `poetry install` installs every non-optional group: the full local
# environment.
#
# Core pins are exact: the history memo's cache key includes the installed
# versions of what the frame builder imports
# (nba_ou.create_training_data.history_memo), so a version bump makes every
# memo entry miss.
[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "2.1.3"
pandas = "2.2.3"
# Parquet: datasets, season partitions, history memo, input cache.
pyarrow = "20.0.0"
scipy = "1.15.2"
scikit-learn = "1.6.1"
tqdm = "4.67.1"
# Registry model specs.
pydantic = "2.11.10"
psycopg = {version = "3.3.2", extras = ["binary"]}
boto3 = "1.42.49"
nba-api = "1.11.4"
requests = "2.32.5"
urllib3 = "2.3.0"

# XGBoost ships as two distributions with the same import name; install exactly
# one. `cuda` is the default PyPI wheel (CUDA build, also runs on CPU) and is
# what the specs are fitted with; `cpu` is the CPU-only build (no NCCL, a much
# smaller download), optional so that `poetry install` never installs both.
[tool.poetry.group.cuda.dependencies]
xgboost = "2.1.4"

[tool.poetry.group.cpu]
optional = true

[tool.poetry.group.cpu.dependencies]
xgboost-cpu = "2.1.4"

# Data-source ingestion: odds scrapers over plain HTTP (Yahoo with httpx),
# injury-report PDFs, and the HTML tables pandas.read_html parses.
[tool.poetry.group.scrape.dependencies]
beautifulsoup4 = "^4.14.2"
lxml = "^6.0.2"
pymupdf = "^1.26.6"
httpx = "^0.28.1"

# Headless Chromium (`playwright install chromium`) for the manual scrapers
# only: SBR's fallback browser engine (`--engine browser`) and the All-Star
# voting scrape. No job exports this group.
[tool.poetry.group.browser.dependencies]
playwright = "^1.57.0"

# Manual YouTube recap audio archives; FFmpeg and Node >=22 are system tools.
[tool.poetry.group.media]
optional = true

[tool.poetry.group.media.dependencies]
yt-dlp = "2026.10.26"
yt-dlp-ejs = "0.8.0"

# training_pipeline: campaign configs, Optuna search, reports.
[tool.poetry.group.train.dependencies]
optuna = "^4.7.0"
pyyaml = "^6.0"
shap = "0.51.0"
matplotlib = "3.10.0"

# Hosted TabPFN predictions (scripts/predict_tabpfn.py).
[tool.poetry.group.tabpfn.dependencies]
tabpfn-client = "0.6.1"

[tool.poetry.group.dashboard.dependencies]
streamlit = "^1.54.0"

# Exploration only (lab/, notebooks).
[tool.poetry.group.lab.dependencies]
autogluon = "^1.5.0"
imblearn = "^0.0"
ipykernel = "6.29.5"
ipywidgets = "^8.1.8"
xlsxwriter = "3.2.2"

[tool.poetry.group.timeseries.dependencies]
tabpfn-time-series = "^1.0.8"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
isort = "^5.13.0"
ruff = ">=0.11.6"
mypy = "^1.11.0"
pytest = "^9.0.2"
pytest-sugar = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["postgres: uses the disposable local NBA_OU_TEST_PG_DSN database"]

# -----------------------------
# Black configuration
# -----------------------------
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.git
    | \.venv
    | build
    | dist
    | .mypy_cache
    | .ruff_cache
    | .pytest_cache
  )/
)
'''

# -----------------------------
# isort configuration
# -----------------------------
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
src_paths = ["."]
known_first_party = ["nba_over_under_predictor"]
default_section = "THIRDPARTY"
sections = [
  "FUTURE",
  "STDLIB",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER"
]

# -----------------------------
# Ruff configuration
# -----------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import rules (aligned with isort)
  "B",  # bugbear
  "UP"  # pyupgrade
]
ignore = [
  "E203",
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["nba_over_under_predictor"]

# -----------------------------
# mypy configuration
# -----------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
