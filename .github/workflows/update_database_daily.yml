name: Update PostgreSQL DB - Games, Players, Refs & Injuries (Local Runner)

on:
  workflow_dispatch:
  # Also run as the first job of retrain_prediction_models.yml.
  workflow_call:
  # schedule:
  #   - cron: "11 12 * * *"
  #   - cron: "11 13 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  update-database:
    # Target your local machine
    runs-on: self-hosted

    env:
      PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"

      # Supabase
      DB_ENV: supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Aiven — the SBR line-history store. Read alongside Supabase: the line
      # history is keyed on nba_games, so both connections are needed.
      AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
      AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}

      # S3 (injury-report archive, input cache): empty means "use the ambient
      # OIDC credentials" rather than a named local profile.
      S3_AWS_PROFILE: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional but recommended on self-hosted runners
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      # A fresh venv per run: the runner's tool-cache Python is shared by
      # every job, so packages another job left there would hide a missing
      # dependency here.
      - name: Create job venv
        run: |
            python -m venv "$RUNNER_TEMP/venv"
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Core plus the scrapers (generated from poetry.lock, see
      # requirements/README.md), then the repo itself WITHOUT its Poetry
      # dependencies, which would pull in the training and lab stacks.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/db-update.txt
          pip install --no-deps -e .

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: DB sanity check
        run: |
          python - <<'PY'
          import os, psycopg
          dsn = os.environ["SUPABASE_DB_URL"]
          with psycopg.connect(dsn) as conn:
            with conn.cursor() as cur:
              cur.execute("select current_database(), current_user;")
              print(cur.fetchone())
          PY

      # Seasons default to the current one, so this needs no yearly edit.
      - name: Update all databases
        run: |
          python scripts/update_databases/update_all_databases.py

      # Must run after the games update: the line history is keyed on
      # nba_games, so last night's games have to be there first. Seasons
      # default to the current one, so this needs no yearly edit.
      - name: Update SBR line history
        run: |
          python scripts/update_databases/update_line_history_database.py

      # Disabled 2026-10-24: OddsLogic and MoviOdds are too slow and unstable
      # for the value they add. Their implementations are retained for possible
      # future reuse, but are unused and will not be maintained. No automatic
      # ingestion or raw-archive updates; training/prediction do not read them.
      # OddsLogic (WagerTalk): separate schema line_history_oddslogic.
      # - name: Update OddsLogic line history
      #   continue-on-error: true
      #   timeout-minutes: 45
      #   run: |
      #     python scripts/update_databases/update_oddslogic_line_history.py

      # MoviOdds (bet365): separate schema line_history_moviodds; disabled above.
      # - name: Update MoviOdds line history
      #   continue-on-error: true
      #   timeout-minutes: 45
      #   run: |
      #     python scripts/update_databases/update_moviodds_line_history.py

      # SBR's feed for the nine US books (covers.com) plus the consensus
      # opener, in its own schema, line_history_covers. Also keyed on
      # nba_games. It writes nothing the rest of the job reads, so a failure
      # (undocumented site endpoints) must not stop the retrain behind this job.
      - name: Update Covers line history
        continue-on-error: true
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/update_databases/update_covers_line_history.py

      # Must run after the line-history update: SBR day pages store each
      # book's last (often live) number, and last night's pre-tip ticks are
      # what replace it.
      - name: Repair SBR closing lines from line history
        run: |
          python scripts/update_databases/repair_sportsbook_closes.py

      # The OIDC session from the first credentials step lasts 1 h, and the
      # steps above can take longer than that, so the S3 steps below take a
      # fresh session each.
      - name: Refresh AWS credentials for the injury archive
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1
          unset-current-credentials: true

      # Every report of the season published so far goes to the S3 archive;
      # the store then gets the spans of every finished game it does not hold
      # yet (at least the last 2 days are rebuilt). It holds a game once it is
      # played, so tonight's games are read live instead.
      - name: Store injury reports and finished games' spans
        run: |
          python scripts/injury_reports/daily_injury_reports.py

      - name: Refresh AWS credentials for the input cache
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1
          unset-current-credentials: true

      # Last: it validates every finished season of the tables above (and the
      # line-history ticks) against the server and re-uploads any that changed,
      # so the prediction job can read them from S3.
      - name: Refresh the S3 input cache
        run: |
          python scripts/refresh_input_cache.py
