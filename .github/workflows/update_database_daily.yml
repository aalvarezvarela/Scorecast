name: Update PostgreSQL DB - Games, Players, Refs & Injuries (Local Runner)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "11 12 * * *"
  #   - cron: "11 13 * * *"

permissions:
  contents: read

jobs:
  update-database:
    # Target your local machine
    runs-on: self-hosted

    env:
      PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"

      # Supabase
      DB_ENV: supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Aiven — the SBR line-history store. Read alongside Supabase: the line
      # history is keyed on nba_games, so both connections are needed.
      AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
      AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional but recommended on self-hosted runners
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: DB sanity check
        run: |
          python - <<'PY'
          import os, psycopg
          dsn = os.environ["SUPABASE_DB_URL"]
          with psycopg.connect(dsn) as conn:
            with conn.cursor() as cur:
              cur.execute("select current_database(), current_user;")
              print(cur.fetchone())
          PY

      - name: Update all databases
        run: |
          python scripts/update_databases/update_all_databases.py --start 2025 --end 2025

      # Must run after the games update: the line history is keyed on
      # nba_games, so last night's games have to be there first. Seasons
      # default to the current one, so this needs no yearly edit.
      - name: Update SBR line history
        run: |
          python scripts/update_databases/update_line_history_database.py

      # Must run after the line-history update: SBR day pages store each
      # book's last (often live) number, and last night's pre-tip ticks are
      # what replace it.
      - name: Repair SBR closing lines from line history
        run: |
          python scripts/update_databases/repair_sportsbook_closes.py
