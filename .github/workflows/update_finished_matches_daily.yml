name: Update Finished Matches Total Points (Local Runner)

on:
    workflow_dispatch:
    # schedule:
    #     # Daily at 4:30am, 7am, 8am, and 10am UTC
    #     - cron: "30 4 * * *"
    #     - cron: "2 6 * * *"
    #     - cron: "27 11 * * *"

permissions:
    contents: read
    id-token: write

jobs:
    run:
        # Off switch: the repository variable DAILY_UPDATE_ENABLED set to false
        # skips every run (docs/serving/snapshot_triggers.md).
        if: ${{ vars.DAILY_UPDATE_ENABLED != 'false' }}
        # Target your local machine
        runs-on: self-hosted

        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"

            # Supabase
            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the prediction store's games (final scores).
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}

            # S3 (lineup raw archive): empty means "use the ambient OIDC
            # credentials" rather than the named profile in config.ini.
            S3_AWS_PROFILE: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Optional but recommended on self-hosted runners
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            # A fresh venv per run: the runner's tool-cache Python is shared by
            # every job, so packages another job left there would hide a missing
            # dependency here.
            - name: Create job venv
              run: |
                  python -m venv "$RUNNER_TEMP/venv"
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

            # Core only: no scraper, no model (see requirements/README.md).
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements/core.txt
                  pip install --no-deps -e .

            - name: DB sanity check
              run: |
                  python - <<'PY'
                  import os, psycopg
                  dsn = os.environ["SUPABASE_DB_URL"]
                  with psycopg.connect(dsn) as conn:
                    with conn.cursor() as cur:
                      cur.execute("select current_database(), current_user;")
                      print(cur.fetchone())
                  PY

            - name: Update finished matches
              run: |
                  cd scripts
                  cd update_databases
                  python update_finished_matches.py

            # The Aiven prediction store grades from its games table; every
            # game past tip-off without a final score is looked up again.
            - name: Update prediction store results
              run: python scripts/prediction_store/update_game_results.py

            # Only the lineup update reads S3. Taken here, not at the start,
            # so the 1 h OIDC session covers this step whatever the ones above
            # took.
            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Update validated lineup stints
              run: python scripts/lineups/update_lineups.py --local-root data --s3
