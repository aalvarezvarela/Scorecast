name: Data - Update Final Scores

on:
    workflow_dispatch:
        inputs:
            force:
                description: "Run even with DAILY_UPDATE_ENABLED set to false"
                type: boolean
                default: false
    # schedule:
    #     # Daily at 4:30am, 7am, 8am, and 10am UTC
    #     - cron: "30 4 * * *"
    #     - cron: "2 6 * * *"
    #     - cron: "27 11 * * *"

permissions:
    contents: read

jobs:
    run:
        # Off switch: the repository variable DAILY_UPDATE_ENABLED set to false
        # skips every run; a manual run with force ticked still goes
        # (docs/serving/snapshot_triggers.md).
        if: ${{ vars.DAILY_UPDATE_ENABLED != 'false' || inputs.force }}
        # Target your local machine
        runs-on: self-hosted

        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            PYTHONUNBUFFERED: "1"

            # Supabase
            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the prediction store's games (final scores).
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # Optional but recommended on self-hosted runners
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # The job's own venv, reused across runs while its requirements and
            # Python stay the same (.github/actions/job-venv).
            # Core only: no scraper, no model (see requirements/README.md).
            - name: Job venv
              uses: ./.github/actions/job-venv
              with:
                  requirements: requirements/core.txt

            - name: DB sanity check
              run: |
                  python - <<'PY'
                  import os, psycopg
                  dsn = os.environ["SUPABASE_DB_URL"]
                  with psycopg.connect(dsn) as conn:
                    with conn.cursor() as cur:
                      cur.execute("select current_database(), current_user;")
                      print(cur.fetchone())
                  PY

            - name: Update finished matches
              run: |
                  cd scripts
                  cd update_databases
                  python update_finished_matches.py

            # The Aiven prediction store grades from its games table; every
            # game past tip-off without a final score is looked up again.
            - name: Update prediction store results
              run: python scripts/prediction_store/update_game_results.py

            # The lineup stint update (scripts/lineups/update_lineups.py --s3)
            # is off while the lineup schemas (2_6, 2_7) are research only.
            # To bring it back, grant the OIDC role s3:ListBucket on the
            # nba_api_raw/ prefix (without it a missing key is a 403, not a
            # 404) and restore the OIDC step, the id-token permission and
            # S3_AWS_PROFILE="" next to it. backfill_lineup_raw.py fills the
            # games missed meanwhile.
