name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba_tests
          POSTGRES_PASSWORD: nba_tests
          POSTGRES_DB: nba_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nba_tests -d nba_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NBA_OU_TEST_PG_DSN: postgresql://nba_tests:nba_tests@localhost:5432/nba_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/tests-cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/tests-cpu.txt

      - name: Run tests
        # Force the progress bar in CI; a test stuck for 5 minutes dumps
        # every thread's stack instead of hanging.
        run: >-
          python -m pytest tests/ --force-sugar
          -o faulthandler_timeout=300
          --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: warn

  requirements:
    name: requirements match poetry.lock
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.3.1 poetry-plugin-export==1.10.1

      # poetry.lock must match pyproject.toml, and every requirements/*.txt
      # must match poetry.lock.
      - name: Check lock and exports
        run: |
          poetry check --lock
          python scripts/export_requirements.py --check
