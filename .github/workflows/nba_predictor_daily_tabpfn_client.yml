name: Predictions - Upcoming Games with TabPFN

# TabPFN on its own: one or more targets and one line per run, each fitted on
# the rows and features of its slot's production build (closing: the frame the daily refit
# stores in S3; intermediate: the horizon's rows of the dataset the build was
# fitted on), on tonight's rows built at run time. Triggered from an external
# cron:
#
#     gh workflow run nba_predictor_daily_tabpfn_client.yml
#     gh workflow run nba_predictor_daily_tabpfn_client.yml -f target=line_error
#     gh workflow run nba_predictor_daily_tabpfn_client.yml \
#         -f line=intermediate -f horizon_minutes=360
#     gh workflow run nba_predictor_daily_tabpfn_client.yml \
#         -f modes="standard thinking_high"
#     gh workflow run nba_predictor_daily_tabpfn_client.yml \
#         -f fits="standard=line_error,total_points thinking_high=line_error"
on:
    workflow_dispatch:
        inputs:
            target:
                description: "Targets separated by spaces or commas: line_error, total_points, spread_error"
                type: string
                default: line_error total_points spread_error
            line:
                description: "Follow the closing slot, or the slot at a fixed time before tip-off"
                type: choice
                options:
                    - closing
                    - intermediate
                default: closing
            horizon_minutes:
                description: "With line=intermediate: minutes before tip-off (an enabled slot's horizon)"
                type: string
                default: "360"
            modes:
                description: "TabPFN modes, each fitted and stored as its own variant: standard, thinking_medium, thinking_high"
                type: string
                default: standard
            fits:
                description: "Each mode with its targets, MODE=TARGET[,TARGET] separated by spaces; replaces target and modes (the scheduler fills it)"
                type: string
                default: ""
            closing_fits:
                description: "With include_closing: the closing line's fits, as fits (empty = the same as the first line)"
                type: string
                default: ""
            use_alt_key:
                description: "Use TABPFN_API_KEY_ALT for every fit (the scheduler sets it at T-8 and T-4)"
                type: boolean
                default: false
            include_closing:
                description: "Also predict the closing line in this job after the intermediate run (T-10, T-8 and T-6)"
                type: boolean
                default: false
            game_date:
                description: "Game date YYYY-MM-DD (empty = today's Pacific date)"
                type: string
                default: ""
            game_ids:
                description: "Only these game IDs, separated by spaces or commas (empty = every game not started)"
                type: string
                default: ""
            as_of:
                description: "Intermediate snapshot cutoff in ISO 8601 with timezone (empty = live)"
                type: string
                default: ""
            snapshot_game_ids:
                description: "With as_of: the games whose snapshot it is (not a filter; the scheduler fills it)"
                type: string
                default: ""
            update_db:
                description: "Update the databases first (off when another job just did)"
                type: boolean
                default: true
            persist:
                description: "Store the predictions (off = dry run: no store rows, no S3 archive)"
                type: boolean
                default: true
            force:
                description: "Run even with PREDICTIONS_ENABLED set to false"
                type: boolean
                default: false

# Queue, never cancel: a fit already paid for must finish.
concurrency:
    group: nba-predictor-tabpfn
    cancel-in-progress: false
    queue: max

permissions:
    contents: read
    id-token: write

jobs:
    run:
        # Off switch: the repository variable PREDICTIONS_ENABLED set to false
        # skips every run; a manual run with force ticked still goes
        # (docs/serving/snapshot_triggers.md).
        if: ${{ vars.PREDICTIONS_ENABLED != 'false' || inputs.force }}
        runs-on: self-hosted
        timeout-minutes: 60
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            PYTHONUNBUFFERED: "1"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the SBR line history, the injury-report timelines and the
            # prediction store.
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
            ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
            TABPFN_ACCESS_TOKEN: ${{ secrets.TABPFN_ACCESS_TOKEN }}
            TABPFN_API_KEY_ALT: ${{ secrets.TABPFN_API_KEY_ALT }}
            TABPFN_USE_ALT_KEY: ${{ inputs.use_alt_key && 'true' || 'false' }}
            S3_AWS_PROFILE: ""
            # Local copies of the season partitions, outside the checkout
            # (actions/checkout cleans it): finished seasons download once.
            NBA_OU_PARTITION_CACHE_DIR: ~/.cache/nba_ou/season_partitions
            # Local input cache outside the checkout (actions/checkout cleans
            # it): finished-season reads and ticks are fetched once per runner.
            NBA_OU_INPUT_CACHE_DIR: ~/.cache/nba_ou/inputs

            # Cron runs in UTC; keep runtime consistent
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # The job's own venv, reused across runs while its requirements and
            # Python stay the same (.github/actions/job-venv).
            - name: Job venv
              uses: ./.github/actions/job-venv
              with:
                  requirements: requirements/predict-tabpfn-cuda.txt

            # Taken right before the run, not at the start: the 1 h OIDC
            # session then outlasts the job's 60 min timeout, so the S3 writes
            # at the end of the run cannot find it expired.
            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Run TabPFN predictor
              env:
                  TABPFN_TARGETS: ${{ inputs.target }}
                  TABPFN_LINE: ${{ inputs.line }}
                  TABPFN_HORIZON: ${{ inputs.horizon_minutes }}
                  # Empty (a dispatch from before the input existed): standard.
                  TABPFN_MODES: ${{ inputs.modes || 'standard' }}
                  TABPFN_FITS: ${{ inputs.fits }}
                  TABPFN_GAME_DATE: ${{ inputs.game_date }}
                  TABPFN_GAME_IDS: ${{ inputs.game_ids }}
                  TABPFN_AS_OF: ${{ inputs.as_of }}
                  TABPFN_SNAPSHOT_GAME_IDS: ${{ inputs.snapshot_game_ids }}
              run: |
                  args=()
                  if [[ "$TABPFN_LINE" == intermediate ]]; then
                      args+=(--horizon-minutes "$TABPFN_HORIZON")
                  fi
                  if [[ -n "$TABPFN_GAME_DATE" ]]; then args+=(--game-date "$TABPFN_GAME_DATE"); fi
                  if [[ -n "$TABPFN_GAME_IDS" ]]; then args+=(--game-ids "$TABPFN_GAME_IDS"); fi
                  if [[ -n "$TABPFN_AS_OF" ]]; then args+=(--as-of "$TABPFN_AS_OF"); fi
                  if [[ -n "$TABPFN_SNAPSHOT_GAME_IDS" ]]; then args+=(--snapshot-game-ids "$TABPFN_SNAPSHOT_GAME_IDS"); fi
                  if [[ -n "$TABPFN_FITS" ]]; then
                      args+=(--fits "$TABPFN_FITS")
                  else
                      args+=(--targets "$TABPFN_TARGETS" --modes "$TABPFN_MODES")
                  fi
                  python scripts/predict_tabpfn.py \
                      --line "$TABPFN_LINE" "${args[@]}" \
                      ${{ !inputs.update_db && '--skip-db-update' || '' }} \
                      ${{ !inputs.persist && '--no-persist' || '' }}

            # Fallback when no normal predictor run covers T-10, T-8 or T-6.
            # Both lines share this job's API key; closing_fits (else fits,
            # else target and modes) gives the closing line's fits.
            - name: Run additional TabPFN closing line
              if: ${{ !cancelled() && inputs.include_closing && inputs.line == 'intermediate' }}
              env:
                  TABPFN_TARGETS: ${{ inputs.target }}
                  TABPFN_MODES: ${{ inputs.modes || 'standard' }}
                  TABPFN_FITS: ${{ inputs.closing_fits || inputs.fits }}
                  TABPFN_GAME_DATE: ${{ inputs.game_date }}
                  TABPFN_GAME_IDS: ${{ inputs.game_ids }}
              run: |
                  args=()
                  if [[ -n "$TABPFN_GAME_DATE" ]]; then args+=(--game-date "$TABPFN_GAME_DATE"); fi
                  if [[ -n "$TABPFN_GAME_IDS" ]]; then args+=(--game-ids "$TABPFN_GAME_IDS"); fi
                  if [[ -n "$TABPFN_FITS" ]]; then
                      args+=(--fits "$TABPFN_FITS")
                  else
                      args+=(--targets "$TABPFN_TARGETS" --modes "$TABPFN_MODES")
                  fi
                  python scripts/predict_tabpfn.py \
                      --line closing --skip-db-update "${args[@]}" \
                      ${{ !inputs.persist && '--no-persist' || '' }}
