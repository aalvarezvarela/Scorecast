name: NBA Predictor TabPFN (Local Runner)

# TabPFN on its own: one target per run, fitted on the closing frame the daily
# refit stores in S3 and the features of the target's production spec, on
# tonight's rows built at run time. Triggered from an external cron:
#
#     gh workflow run nba_predictor_daily_tabpfn_client.yml -f target=line_error
on:
    workflow_dispatch:
        inputs:
            target:
                description: "Target to fit and predict"
                type: choice
                options:
                    - line_error
                    - total_points
                    - spread_error
                default: line_error
            update_db:
                description: "Update the databases first (off when another job just did)"
                type: boolean
                default: true
            persist:
                description: "Store the predictions (off = dry run: no store rows, no S3 archive)"
                type: boolean
                default: true

# Queue, never cancel: a fit already paid for must finish.
concurrency:
    group: nba-predictor-tabpfn
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    run:
        runs-on: self-hosted
        timeout-minutes: 60
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the SBR line history, the injury-report timelines and the
            # prediction store.
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
            ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
            TABPFN_ACCESS_TOKEN: ${{ secrets.TABPFN_ACCESS_TOKEN }}
            S3_AWS_PROFILE: ""

            # Cron runs in UTC; keep runtime consistent
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_predict_tabpfn.txt
                  pip install --no-deps -e .

            # The scheduled-games odds scrape drives a browser.
            - name: Install Playwright browsers
              run: playwright install chromium

            - name: Run TabPFN predictor
              run: |
                  python scripts/predict_tabpfn.py --target ${{ inputs.target }} \
                      ${{ !inputs.update_db && '--skip-db-update' || '' }} \
                      ${{ !inputs.persist && '--no-persist' || '' }}
