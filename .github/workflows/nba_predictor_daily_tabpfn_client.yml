name: Daily NBA Predictor TABPFN Client (Local Runner)

on:
    workflow_dispatch:
    # schedule:
    #     # Every day at 21:01 UTC
    #     - cron: "01 19 * * *"
    #     # Every day at 21:01 UTC
    #     - cron: "01 21 * * *"
    #     - cron: "01 18 * * *"

concurrency:
    group: daily-nba-predictor-tabpfn-client
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

jobs:
    run:
        runs-on: self-hosted
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            TABPFN_ACCESS_TOKEN: ${{ secrets.TABPFN_ACCESS_TOKEN }}
            S3_AWS_PROFILE: ""

            # Cron runs in UTC; keep runtime consistent
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements_tabpfn.txt

            - name: Run NBA predictor
              run: python scripts/predict_nba_games.py
