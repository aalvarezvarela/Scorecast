name: Predictions - Past Game Snapshots

# The day's last run: once every game of the date has tipped (after they
# finish is fine), every snapshot is in the past, so each intermediate slot
# predicts exactly the row of its own horizon -- the row it was trained on, no
# prediction across horizons. scripts/predict_past_snapshots.py.
on:
    workflow_dispatch:
        inputs:
            game_date:
                description: "Game date YYYY-MM-DD (empty = the Eastern date 12 h ago: last night's games)"
                type: string
                default: ""
            persist:
                description: "Store the predictions (off = dry run: no Aiven prediction-store rows, no S3 run archive)"
                type: boolean
                default: true
            force:
                description: "Run even with PREDICTIONS_ENABLED set to false"
                type: boolean
                default: false

# Shares the daily predictor's queue: the two never build at the same time.
concurrency:
    group: daily-nba-predictor
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    run:
        # Off switch: the repository variable PREDICTIONS_ENABLED set to false
        # skips every run; a manual run with force ticked still goes
        # (docs/serving/snapshot_triggers.md).
        if: ${{ vars.PREDICTIONS_ENABLED != 'false' || inputs.force }}
        runs-on: self-hosted
        timeout-minutes: 120
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureW\
                arning"
            PYTHONUNBUFFERED: "1"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the SBR line history, the injury-report timelines and the
            # prediction store (the only place predictions are written;
            # Supabase is read only).
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
            ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
            S3_AWS_PROFILE: ""
            # Local input cache outside the checkout (actions/checkout cleans
            # it): finished-season reads and ticks are fetched once per runner.
            NBA_OU_INPUT_CACHE_DIR: ~/.cache/nba_ou/inputs

            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            # The job's own venv, reused across runs while its requirements and
            # Python stay the same (.github/actions/job-venv).
            # The predictor's own dependencies, as in the daily predictor.
            - name: Job venv
              uses: ./.github/actions/job-venv
              with:
                  requirements: requirements/predict-cuda.txt

            - name: Predict every intermediate slot on its own snapshot
              env:
                  GAME_DATE: ${{ inputs.game_date }}
              run: |
                  python scripts/predict_past_snapshots.py \
                      ${GAME_DATE:+--game-date "$GAME_DATE"} \
                      ${{ !inputs.persist && '--no-persist' || '' }}
