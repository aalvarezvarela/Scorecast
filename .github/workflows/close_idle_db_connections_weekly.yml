name: Database - Close Idle Connections

on:
    workflow_dispatch:
    schedule:
        # Weekly on Sunday at 03:15 UTC
        - cron: "15 3 * * 0"

concurrency:
    group: close-idle-db-connections
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    close-idle-connections:
        runs-on: ubuntu-latest

        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install database dependency
              run: |
                  python -m pip install --upgrade pip
                  pip install "psycopg[binary]==3.3.2"

            - name: Close idle database connections
              run: python scripts/close_idle_db_connections.py
