name: Daily NBA Predictor (Local Runner)

on:
    workflow_dispatch:
        inputs:
            persist:
                description: "Store the predictions (off = dry run: no table rows, no S3 snapshots)"
                type: boolean
                default: true
    # schedule:
    #     # Every day at 23:00 UTC (1 hour before midnight)
    #     - cron: "11 00 * * *"
    #     - cron: "11 23 * * *"
    #     # Weekdays during peak hoursk
    #     - cron: "01 15 * * *"
    #     - cron: "11 17 * * *"
    #     - cron: "11 16 * * *"
    #     - cron: "11 20 * * *"
        # - cron: "11 22 * * *"
# Queue, never cancel: a run that outlasts the gap between two triggers must
# finish rather than be killed halfway through its slots.
concurrency:
    group: daily-nba-predictor
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    run:
        runs-on: self-hosted
        timeout-minutes: 120
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureW\
                arning"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the SBR line history (live intermediate rows read it) and
            # the injury-report timelines.
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
            ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
            S3_AWS_PROFILE: ""
            # Local input cache outside the checkout (actions/checkout cleans
            # it): finished-season reads and ticks are fetched once per runner.
            NBA_OU_INPUT_CACHE_DIR: ~/.cache/nba_ou/inputs

            # Cron runs in UTC; keep runtime consistent
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            # A fresh venv per run: the runner's tool-cache Python is shared by
            # every job, so packages another job left there would hide a missing
            # dependency here.
            - name: Create job venv
              run: |
                  python -m venv "$RUNNER_TEMP/venv"
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

            # Only what the predictor needs (generated from poetry.lock, see
            # requirements/README.md), then the repo itself WITHOUT its Poetry
            # dependencies, which would pull in the training and lab stacks.
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements/predict-cuda.txt
                  pip install --no-deps -e .

            # Every enabled slot (closing and intermediate, all targets)
            # predicts on every run, whatever the time to tip.
            - name: Run NBA predictor
              run: |
                  python scripts/predict_nba_games.py \
                      ${{ github.event_name == 'workflow_dispatch' && !inputs.persist && '--no-persist' || '' }}
