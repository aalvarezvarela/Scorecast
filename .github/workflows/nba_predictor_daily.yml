name: Predictions - Upcoming NBA Games

on:
    workflow_dispatch:
        inputs:
            persist:
                description: "Store the predictions (off = dry run: no Aiven prediction-store rows, no S3 run archive)"
                type: boolean
                default: true
            force:
                description: "Run even with PREDICTIONS_ENABLED set to false"
                type: boolean
                default: false
            tabpfn:
                description: "TabPFN jobs after the predictions, ';'-separated HORIZON[@AS_OF[@GAME_IDS]] (0 = closing; empty = none; the scheduler fills it)"
                type: string
                default: ""
            tabpfn_modes:
                description: "TabPFN modes of those jobs: standard, thinking_medium, thinking_high"
                type: string
                default: standard
            tabpfn_use_alt_key:
                description: "Use TABPFN_API_KEY_ALT for every TabPFN fit in this run (required at T-8)"
                type: boolean
                default: false
            tabpfn_refresh:
                description: "Fetch reports and odds again before the TabPFN jobs and predict at that moment, not at their snapshot"
                type: boolean
                default: false
    # schedule:
    #     # Every day at 23:00 UTC (1 hour before midnight)
    #     - cron: "11 00 * * *"
    #     - cron: "11 23 * * *"
    #     # Weekdays during peak hoursk
    #     - cron: "01 15 * * *"
    #     - cron: "11 17 * * *"
    #     - cron: "11 16 * * *"
    #     - cron: "11 20 * * *"
        # - cron: "11 22 * * *"
# Queue, never cancel: a run that outlasts the gap between two triggers must
# finish rather than be killed halfway through its slots.
concurrency:
    group: daily-nba-predictor
    cancel-in-progress: false
    queue: max

permissions:
    contents: read
    id-token: write

jobs:
    run:
        # Off switch: the repository variable PREDICTIONS_ENABLED set to false
        # skips every run; a manual run with force ticked still goes
        # (docs/serving/snapshot_triggers.md).
        if: ${{ vars.PREDICTIONS_ENABLED != 'false' || inputs.force }}
        runs-on: self-hosted
        timeout-minutes: 120
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureW\
                arning"
            PYTHONUNBUFFERED: "1"
            TQDM_DISABLE: "1"

            # Critical for resolving imports that live under src/
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            # Aiven: the SBR line history (live intermediate rows read it),
            # the injury-report timelines and the prediction store (the only
            # place predictions are written; Supabase is read only).
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
            ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
            # The TabPFN jobs a run carries (--tabpfn) fit on the hosted API.
            TABPFN_ACCESS_TOKEN: ${{ secrets.TABPFN_ACCESS_TOKEN }}
            TABPFN_API_KEY_ALT: ${{ secrets.TABPFN_API_KEY_ALT }}
            TABPFN_USE_ALT_KEY: ${{ inputs.tabpfn_use_alt_key && 'true' || 'false' }}
            S3_AWS_PROFILE: ""
            # Local copies of the season partitions the TabPFN jobs fit on,
            # outside the checkout: finished seasons download once.
            NBA_OU_PARTITION_CACHE_DIR: ~/.cache/nba_ou/season_partitions
            # Local input cache outside the checkout (actions/checkout cleans
            # it): finished-season reads and ticks are fetched once per runner.
            NBA_OU_INPUT_CACHE_DIR: ~/.cache/nba_ou/inputs

            # Cron runs in UTC; keep runtime consistent
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # The job's own venv, reused across runs while its requirements and
            # Python stay the same (.github/actions/job-venv).
            # Only what the predictor needs (generated from poetry.lock, see
            # requirements/README.md), then the repo itself WITHOUT its Poetry
            # dependencies, which would pull in the training and lab stacks.
            # With the tabpfn group: a run may carry TabPFN jobs (--tabpfn).
            - name: Job venv
              uses: ./.github/actions/job-venv
              with:
                  requirements: requirements/predict-tabpfn-cuda.txt

            # Taken right before the run, not at the start: the 1 h OIDC
            # session then lasts as long as it can into a run that carries
            # TabPFN jobs, whose S3 writes come last.
            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            # Every enabled slot (closing and intermediate, all targets)
            # predicts on every run, whatever the time to tip.
            - name: Run NBA predictor
              env:
                  TABPFN_JOBS: ${{ inputs.tabpfn }}
                  # Empty (a dispatch from before the input existed): standard.
                  TABPFN_MODES: ${{ inputs.tabpfn_modes || 'standard' }}
              run: |
                  python scripts/predict_nba_games.py \
                      ${TABPFN_JOBS:+--tabpfn "$TABPFN_JOBS" --tabpfn-modes $TABPFN_MODES} \
                      ${{ inputs.tabpfn_refresh && '--tabpfn-refresh' || '' }} \
                      ${{ github.event_name == 'workflow_dispatch' && !inputs.persist && '--no-persist' || '' }}
