name: Predictions - Schedule Game Day Runs

# Books today's runs of the daily predictor on cron-job.org at the snapshot
# times of every game (tip-off minus each enabled horizon), snapshots at most
# 30 min apart sharing one run and T-30 always at its own time, leaving out
# times already past or outside the predictor's US/Pacific date. Each run
# predicts every enabled slot. Also books TabPFN at each game's T-720/480/360/240.
# Meant to be dispatched once a day by
# cron-job.org itself (a row in scripts/cronjobs/setup_cronjobs.py).
# scripts/cronjobs/schedule_snapshot_triggers.py, docs/serving/snapshot_triggers.md.
on:
    workflow_dispatch:
        inputs:
            game_date:
                description: "Game date YYYY-MM-DD (empty = today's Eastern date)"
                type: string
                default: ""
            apply:
                description: "Book the jobs (off = dry run: print the plan only)"
                type: boolean
                default: true
            force:
                description: "Run even with PREDICTIONS_ENABLED set to false"
                type: boolean
                default: false

concurrency:
    group: snapshot-trigger-scheduler
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    run:
        # Off switch: the repository variable PREDICTIONS_ENABLED set to false
        # books nothing, and the runs booked earlier skip themselves; a manual run
        # with force ticked still goes (docs/serving/snapshot_triggers.md).
        if: ${{ vars.PREDICTIONS_ENABLED != 'false' || inputs.force }}
        # stats.nba.com often refuses GitHub-hosted runners' IPs.
        runs-on: self-hosted
        # Growing the pool can create many TabPFN jobs, spaced 13 s apart.
        timeout-minutes: 30
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureW\
                arning"
            PYTHONUNBUFFERED: "1"
            TQDM_DISABLE: "1"
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
            CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
            CRONJOB_GITHUB_DISPATCH_TOKEN: ${{ secrets.CRONJOB_GITHUB_DISPATCH_TOKEN }}
            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            # The job's own venv, reused across runs while its requirements and
            # Python stay the same (.github/actions/job-venv).
            - name: Job venv
              uses: ./.github/actions/job-venv
              with:
                  requirements: requirements/core.txt

            - name: Book today's snapshot triggers
              env:
                  GAME_DATE: ${{ inputs.game_date }}
              run: |
                  python scripts/cronjobs/schedule_snapshot_triggers.py \
                      ${GAME_DATE:+--game-date "$GAME_DATE"} \
                      ${{ inputs.apply && '--apply' || '' }}
