name: Retrain Prediction Models

on:
  workflow_dispatch:
    inputs:
      update_database:
        description: "Run the full DB update (update_database_daily.yml, self-hosted) first"
        type: boolean
        default: true
      promote:
        description: "Promote the staged builds to production (off = stage and smoke-test only)"
        type: boolean
        default: false
      slots:
        description: "Only these slots, space-separated (e.g. 2_5/line_error/t0000/main); empty = every enabled slot"
        type: string
        default: ""
  # schedule:
  #   - cron: "56 13 * * *"

permissions:
  contents: read
  id-token: write

# Queue, never cancel: a refit killed between staging and promotion leaves
# staging ahead of production for no reason.
concurrency:
  group: retrain-prediction-models
  cancel-in-progress: false

jobs:
  # The same DB update the daily workflow runs, on the self-hosted runner: the
  # NBA/odds sources block GitHub-hosted IPs. Training on a partial update would
  # use last night's SBR closes before they are repaired from line history.
  update-database:
    if: ${{ inputs.update_database }}
    uses: ./.github/workflows/update_database_daily.yml
    secrets: inherit

  # GitHub-hosted, so the refit does not occupy the local machine. Reads only:
  # Supabase and Aiven (both reachable from hosted runners) and S3.
  retrain:
    needs: update-database
    # Runs after a successful update, or straight away when it was switched off.
    if: ${{ !cancelled() && (needs.update-database.result == 'success' || needs.update-database.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
      TQDM_DISABLE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      DB_ENV: supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Aiven: the closing build reads the injury-report state and the SBR
      # closing ticks from it.
      AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
      AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}
      # Empty means "use the ambient OIDC credentials" rather than a named
      # local profile.
      S3_AWS_PROFILE: ""
      # ROSTER_*_PCT depends on set iteration order; pinned so a build is
      # reproducible.
      PYTHONHASHSEED: "0"
      TZ: UTC
      SLOTS: ${{ inputs.slots }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      # Only what the three scripts below import (requirements_retrain.txt),
      # then the repo itself WITHOUT its Poetry dependencies, which would pull
      # in the training and lab stacks.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_retrain.txt
          pip install --no-deps -e .

      # The `slots` input becomes repeated --slot flags, shared by every step
      # below so smoke test and promotion act on exactly what was refitted.
      - name: Resolve slot arguments
        id: slots
        run: |
          args=""
          for slot in $SLOTS; do args="$args --slot $slot"; done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Refit enabled slots from their specs
        run: python scripts/retrain_prediction_models.py ${{ steps.slots.outputs.args }}

      # Loads each staged booster and checks it agrees with its spec before
      # anything is pointed at it. Promotion is a single pointer write, so
      # there is no partially-moved state to wait out.
      - name: Smoke test the staged builds
        run: python scripts/smoke_test_s3_model_load.py --channel staging ${{ steps.slots.outputs.args }}

      - name: Promote staged builds to production
        if: ${{ inputs.promote }}
        run: python scripts/promote_build.py --execute ${{ steps.slots.outputs.args }}

      - name: Show what promotion would do
        if: ${{ !inputs.promote }}
        run: python scripts/promote_build.py ${{ steps.slots.outputs.args }}
