name: Retrain Prediction Models

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "56 13 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  update-database:
    runs-on: self-hosted
    outputs:
      has_scheduled_games: ${{ steps.check-scheduled-games.outputs.has_scheduled_games }}
    env:
      PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
      TQDM_DISABLE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      DB_ENV: supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for scheduled games
        id: check-scheduled-games
        run: |
          python scripts/update_databases/check_scheduled_games.py

      - name: Install Playwright browsers
        if: ${{ steps.check-scheduled-games.outputs.has_scheduled_games == 'true' }}
        run: |
          playwright install chromium

      - name: Update all databases
        if: ${{ steps.check-scheduled-games.outputs.has_scheduled_games == 'true' }}
        run: |
          python scripts/update_databases/update_all_databases.py --only-new-games

  retrain:
    needs: update-database
    if: ${{ needs.update-database.outputs.has_scheduled_games == 'true' }}
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
      TQDM_DISABLE: "1"
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
      DB_ENV: supabase
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      S3_AWS_PROFILE: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refit enabled slots from their specs
        run: python scripts/retrain_prediction_models.py

      # Loads each staged booster and checks it agrees with its spec before
      # anything is pointed at it. Promotion is a single pointer write, so
      # there is no partially-moved state to wait out.
      - name: Smoke test the staged builds
        if: ${{ success() }}
        run: python scripts/smoke_test_s3_model_load.py --channel staging

      - name: Promote staged builds to production
        if: ${{ success() }}
        run: python scripts/promote_build.py --execute
