# Adapted from the Streamlit skill's financial-dashboard theme for 1.54.
[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["32px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
orangeColor = "#FB923C"
blueColor = "#60A5FA"
grayColor = "#94A3B8"
dataframeHeaderBackgroundColor = "#1E293B"
chartCategoricalColors = ["#FB923C", "#60A5FA", "#A78BFA", "#34D399", "#94A3B8"]

[client]
showErrorDetails = "none"
