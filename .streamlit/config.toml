# NBA logo colors: blue #17408B, red #C9082A and white. The background is a
# mid navy rather than near-black; red/blue tints keep text contrast >= 4.5:1.
[theme]
base = "dark"
primaryColor = "#FF5C70"
backgroundColor = "#182A4E"
secondaryBackgroundColor = "#253D6C"
textColor = "#F4F6FB"
linkColor = "#A9C6FF"
borderColor = "#3A5790"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
headingFontSizes = ["32px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
redColor = "#C9082A"
redTextColor = "#FF8E9A"
redBackgroundColor = "#4D2340"
blueColor = "#17408B"
blueTextColor = "#7AD7FF"
blueBackgroundColor = "#163F76"
grayColor = "#AFBCD4"
dataframeHeaderBackgroundColor = "#253D6C"
chartCategoricalColors = ["#FF8E9A", "#7AD7FF", "#F4F6FB", "#AFBCD4"]

[client]
showErrorDetails = "none"
