# TEMP: quick 10-minute feel for the 2145-column "training_data_2_0" snapshot.
# Same settings as temp_old_dataset.yaml so the only deliberate difference is
# the dataset -- note the holdout WINDOWS still differ (see below).
experiment_name: temp
training_version: temp-dataset-comparison
comparison_group: temp_csv_comparison
hypothesis: >
  Quick smoke look at the 2145-column snapshot on LINE_ERROR with a 3-season
  window, next to the older 3240-column file. Deliberately under-tuned.
tags: [temp, line_error, dataset_comparison, train_2_0_2145col]

target_family: line_error

data:
  csv_path: data/train_data/tranining_data_2_0_20260110.csv
  data_version: "20260110-train-2-0-2145col"
  expected_checksum: "sha256:a5068c5769353b7f"

sample_weight:
  enabled: true
  lambda_: 0.005
  tune_lambda: false

walk_forward:
  max_folds: 4

optuna:
  timeout: 600          # 10 minutes
  mae_tolerance_abs: 0.05
