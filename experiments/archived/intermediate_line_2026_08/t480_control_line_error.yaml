# Control run: 8-hour line-error model instead of the 12-hour T=720 control.
#
# The intermediate-line CSV has snapshots at 30/60/120/240/480/720 minutes, so
# there is no true 6-hour row to slice. T=480 is the closest earlier control
# point on the grid. This uses the same single-snapshot control shape as
# t720_control_line_error.yaml, but trained only on T=480 rows.
#
# Build its CSV first:
#   poetry run python scripts/create_train_data/slice_intermediate_snapshot.py --snapshot 480
#
# Then run with the ordinary CLI:
#   poetry run python -m training_pipeline.cli \
#       experiments/intermediate_line_2026_08/t480_control_line_error.yaml

experiment_name: intermediate_t480_control_line_error
training_version: "intermediate-line-1.0"
comparison_group: intermediate_line_2026_08
hypothesis: >
  A model trained only on 8-hour-out rows, as a control for the pooled
  line-error run at snapshot 480. If pooling helps at 8h, the pooled model
  scored at snapshot 480 should beat this; if it does not, the shared model is
  diluting that horizon rather than informing it.
tags: [intermediate_line, single_snapshot, control, line_error, t480]

prediction_strategy: line_error_regressor
device: cuda

data:
  csv_path: data/train_data/intermediate_line_data_20260412_t480.csv
  data_version: "20260412-intermediate-line-t480"
  expected_checksum: null
  season_year_floor: 2021
  exclude_playoffs: true
  allowed_season_types: ["Regular Season", "Play-In Tournament"]

walk_forward:
  train_games: 3750
  min_train_games: 1875
  test_games: 50
  step_games_between_tests: 60
  max_folds: 12

backtest:
  test_games: 300

sample_weight:
  enabled: true

optuna:
  n_trials: 50
  timeout: null

evaluation_seeds: [101, 202]
