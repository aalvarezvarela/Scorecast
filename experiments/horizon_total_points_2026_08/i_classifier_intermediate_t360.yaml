experiment_name: horizon_classifier_intermediate_t360
prediction_strategy: over_under_classifier
line_col: ODDS_TOTAL_LINE_bet365
training_version: "2.2-horizon-sweep"
comparison_group: horizon_2026_08
hypothesis: >
  The classifier at the executable horizon, read against f_intermediate_t360 in
  both streams -- same dataset, same snapshot, same grid, target formulation the
  only difference. Paired with the closing-line classifier cell in the line-error
  stream, the two say whether the classifier's standing depends on when the bet
  is placed; they are not controls for each other, since dataset and horizon both
  move between them.
  COHORT WARNING, and it cannot be configured away: the classifier's label is
  "did the total beat this line", so a game landing exactly on the line has no
  label and is dropped at the data level. Measured: 6,075 games against the
  regressors' 6,148 on the closing dataset. Its holdout is therefore NOT the
  same cohort as the regressor cells it is read against, which is a caveat on
  the comparison rather than a reason not to make it.
tags: [classifier, intermediate_line, single_snapshot, t360, corr995]

device: cuda

data:
  csv_path: data/train_data/intermediate_line_data_10snap.csv
  data_version: "20260820-intermediate-line-10-snapshots-t360"
  dataset_type: intermediate_line
  snapshot_minutes: 360
  scoring_csv_path: data/train_data/intermediate_line_data_10snap_scoring.csv
  expected_checksum: "sha256:1e3ca3fe18d2bbe8"
  season_year_floor: 2021
  extend_history_dropping_season_gated_columns: false

cleaning:
  # Campaign-wide change: odds columns held to 0.995 instead of the 0.99 the
  # previous campaign used. Everything not matching "ODDS_" stays at
  # cleaning.corr_threshold (0.95), which this does not touch.
  corr_threshold_overrides:
    ODDS_: 0.995

walk_forward:
  train_games_choices: [2500, 3000, 3500, 4000]

optuna:
  # 300 rather than the previous 200. Measured cost on this hardware: ~34 s per
  # trial on the closing dataset, so +100 trials is ~57 min per closing cell.
  n_trials: 300
  timeout: null

betting:
  comparison_line_cols: ["ODDS_CLOSING_TOTAL_LINE_bet365"]

# The only error bar this pipeline produces, and it is nearly free: the 55-day
# holdout walk-forward takes 2m16s against ~2h of tuning, so two extra seeds add
# ~4% to a closing cell. An archived classifier run moved from -0.4% to +8.7% ROI
# across exactly these three seeds on one fixed configuration. Read
# seed_stability.csv BEFORE reading any difference between cells.
evaluation_seeds: [101, 202]
