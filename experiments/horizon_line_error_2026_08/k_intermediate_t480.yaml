experiment_name: horizon_line_error_intermediate_t480
prediction_strategy: line_error_regressor
training_version: "2.2-horizon-sweep"
comparison_group: horizon_2026_08
hypothesis: >
  A model trained only on the T-480 snapshot, filling the eight-hour gap in the
  horizon curve. Read it against the T-480 row of the pooled model's
  snapshot_holdout_metrics.csv; the only intended difference is one dedicated
  horizon versus one pooled model.
tags: [line_error, intermediate_line, single_snapshot, t480, control, corr995, gap_fill]

device: cuda

data:
  csv_path: data/train_data/intermediate_line_data_10snap.csv
  data_version: "20260820-intermediate-line-10-snapshots-t480"
  dataset_type: intermediate_line
  snapshot_minutes: 480
  scoring_csv_path: data/train_data/intermediate_line_data_10snap_scoring.csv
  expected_checksum: "sha256:1e3ca3fe18d2bbe8"
  season_year_floor: 2021
  extend_history_dropping_season_gated_columns: false

cleaning:
  corr_threshold_overrides:
    ODDS_: 0.995

walk_forward:
  train_games_choices: [2500, 3000, 3500, 4000]

optuna:
  n_trials: 300
  timeout: null

betting:
  comparison_line_cols: ["ODDS_CLOSING_TOTAL_LINE_bet365"]

evaluation_seeds: [101, 202]
