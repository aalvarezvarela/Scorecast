experiment_name: target_line_error_intermediate_t360
prediction_strategy: line_error_regressor
training_version: "2.1-target-snapshot-campaign"
comparison_group: target_snapshot_2026_08
hypothesis: >
  A line-error model trained only on the six-hour snapshot is the specialised
  control for the pooled model. Comparing both at T-360 isolates whether
  pooling horizons helps or dilutes the model at the intended betting time.
tags: [line_error, intermediate_line, single_snapshot, t360, control]

device: cuda

data:
  csv_path: data/train_data/intermediate_line_data_10snap.csv
  data_version: "20260820-intermediate-line-10-snapshots-t360"
  dataset_type: intermediate_line
  snapshot_minutes: 360
  scoring_csv_path: data/train_data/intermediate_line_data_10snap_scoring.csv
  expected_checksum: "sha256:1e3ca3fe18d2bbe8"
  season_year_floor: 2021
  extend_history_dropping_season_gated_columns: false

betting:
  comparison_line_cols: ["ODDS_CLOSING_TOTAL_LINE_bet365"]

optuna:
  n_trials: 200
  timeout: null

evaluation_seeds: []
