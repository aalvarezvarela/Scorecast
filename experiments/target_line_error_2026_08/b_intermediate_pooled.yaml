experiment_name: target_line_error_intermediate_pooled
prediction_strategy: line_error_regressor
training_version: "2.1-target-snapshot-campaign"
comparison_group: target_snapshot_2026_08
hypothesis: >
  One line-error model trained on all ten pre-game snapshots can match a model
  dedicated to six hours before tip-off while remaining usable at every
  available horizon. The registered comparison is its T-360 result; its other
  per-snapshot results are exploratory.
