hypothesis: >
  TREATMENT of pair 3: the daily rolling origin on the closing dataset with the
  total-points target, against cell E's 4-day control. Cell A carries the
  campaign-wide statement and the validity gates; cell E carries why a second
  target is in this campaign at all. Read both first.

  The variable and its consequences are pair 1's and pair 2's: one game-day per
  origin with a 5-game floor, region pinned to cell E so the same games are
  scored, ~4x the folds and ~4x the fits per trial.

  CHECK tie_n_completed against cell E BEFORE any result, as in every 1-day
  cell here. If the pruner again kills materially more trials than in the
  control, the pair is not an equal-search comparison and that fact is the
  finding.
