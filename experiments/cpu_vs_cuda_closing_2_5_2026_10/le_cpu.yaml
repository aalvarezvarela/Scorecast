# Campaign cpu_vs_cuda_closing_2_5_2026_10: does the promoted closing line_error configuration
# score the same when fitted on CPU as on CUDA?
#
# Copy of experiments/retrain_line_error_2_5_2026_10/closing_line_error.yaml
# (the YAML behind the promoted 2_5 slot, source run retrain25_line_error_closing_20261017_110124) with:
#   - optuna.fixed_*: the selected trial's hyperparameters, so nothing is tuned;
#   - device: cpu  <- the ONLY difference between the _cuda and _cpu cells.
# Same seeds in both cells (random_state 17 + evaluation_seeds 101, 202), so
# each cell carries its own seed spread as the noise floor.
#
# Why: the daily refit and promote's production fit now run on CPU, and CUDA
# and CPU XGBoost give different models from the same seed (79% same side for
# closing line_error). The configuration was only ever evaluated on CUDA.
#
# Pre-registered reading: CPU is "the same" if its CV and holdout win rate and
# ROI sit inside the CUDA cell's own seed range. Control: the CUDA cell's
# primary-seed holdout should reproduce the source run's holdout (same data,
# params, rounds, seed, device); if it does not, the fixed-params path differs
# from the tuned one and the CUDA cell -- not the source run -- is the reference.
experiment_name: cvc_line_error_closing_cpu
prediction_strategy: line_error_regressor
training_version: 2.19-schema25-defect-fixes-20261016
comparison_group: cpu_vs_cuda_closing_2_5_2026_10_line_error
hypothesis: Promoted closing line_error configuration with fixed selected hyperparameters,
  fitted on CPU; paired with the cuda cell, identical but for device.
tags:
- cpu_vs_cuda
- schema_2_5
- line_error
- closing_line
- fixed_params
- cpu
