experiment_name: histdepth25_t720_a_floor2021_na500
prediction_strategy: line_error_regressor
training_version: "2.14-schema25-history-depth-20260922"
comparison_group: history_depth_line_error_2_5_2026_09
hypothesis: >
  Baseline arm. Current production setting: 2021 floor, 500-NaN row budget. Every other arm is read against this one at the same horizon.
tags: [intermediate_line, single_snapshot, t720, line_error, schema_2_5, history_depth,
       floor_2021, max_na_500, tuned_train_games, cv_6x100, corr_odds_098, no_time_decay]
device: cuda
random_state: 16
data:
  csv_path: data/train_data/intermediate_line_data_2_5_20260613.csv
  data_version: "20260918-intermediate-line-2.5-t720"
  expected_checksum: "sha256:5bda016d4c872e0d"
  dataset_type: intermediate_line
  snapshot_minutes: 720
  scoring_csv_path: data/train_data/intermediate_line_data_2_5_20260613_scoring.csv
  season_year_floor: 2021
  extend_history_dropping_season_gated_columns: false
  exclude_overtime_from_training: false
  exclude_playoffs: true
  allowed_season_types: ["Regular Season", "Play-In Tournament"]
cleaning: {max_na_per_row: 500, corr_threshold: 0.95, corr_threshold_overrides: {"ODDS_": 0.98}}
holdout: {test_size: null, test_games: null, test_days: 90}
walk_forward:
  strategy: test_anchored
  test_games: 100
  # 120 > test_games, so the six validation blocks do not overlap.
  step_games_between_tests: 120
  train_games: 3500
  # Five rungs, evenly spaced from 3500 to THIS arm's ceiling -- the cleaned
  # history before its earliest CV fold, MEASURED by the pre-flight on
  # 2026-09-22 at 3988 games, not inferred from raw-file counts. Inferring it
  # is what broke the first attempt: max_na_per_row is applied AFTER column
  # cleaning, so the cleaned history is smaller than the raw game count says,
  # and every arm's top rung overshot. The top rung is the largest multiple of
  # 25 at least 25 games below the ceiling; a rung above it is a hard ValueError
  # that costs the cell. Same rung COUNT in every arm so the search space is the
  # same size; only the span differs. The floor is 3500 and not the parent
  # campaign's 2500 so an arm that admits extra seasons cannot answer the
  # question by training on less.
  train_games_choices: [3500, 3600, 3725, 3850, 3950]
  min_train_games: 1250
  max_folds: 6
  fold_selection: latest
  exclude_test_months: [5, 6]
  require_same_season_test: true
  eval_span_games: null
  min_validation_games: null
sample_weight: {enabled: false, lambda_: null, tune_lambda: false, allow_unweighted: false}
refit: {use_lexicographic_selection: true}
optuna:
  n_trials: 150
  timeout: null
  persistent_storage: false
  tune_n_estimators: false
  objective_aggregation: pooled
  pruner_warmup_steps: 7
  tie_tolerance: quantile
  tie_max_fraction: 0.15
  tie_tolerance_floor: 0.001
  tie_tolerance_cap: 0.04
  tie_warn_fraction: 0.25
  search_space: {n_estimators: 1000, early_stopping_rounds: 70, n_estimators_range: null}
betting:
  edge_thresholds: [0.0, 0.1, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
  primary_edge_threshold: 0.1
  flat_decimal_odds: 1.9090909090909092
  comparison_line_cols: [ODDS_CLOSING_TOTAL_LINE_bet365]
holdout_evaluation: daily_walk_forward
evaluation_seeds: [101, 202]
