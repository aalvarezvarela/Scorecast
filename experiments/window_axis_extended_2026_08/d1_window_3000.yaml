# CELL D1 -- the window axis, measured instead of sampled. 3,000-game window.
#
# WHY THIS CAMPAIGN EXISTS
#
# public_betting_tradeoff_2026_08 cell C put the training window in Optuna's
# search space and asked it to find out whether the two extra seasons help. It
# could not answer, and the run directory says why:
#
#   - 95 of 120 trials were pruned, and 94 of those died at fold 8 -- the FIRST
#     fold MedianPruner is allowed to act on (round(30 * 0.25)). Nothing
#     survived long enough to be judged on more than a quarter of the folds.
#   - Its completed trials spanned 14.393-14.428 MAE, a 0.035 spread on a base
#     of 14.4. "Above the median at fold 8" over ~240 validation games is then a
#     coin flip, so the pruner was arbitrating noise, not separating configs.
#   - TPE, fed 25 real observations out of a 120-trial budget, collapsed onto
#     train_games=3500 (51 of 120 trials). The large windows that were the
#     entire mechanism of that cell got 29 trials and 5 completions:
#     5000 -> 2, 6000 -> 1, 6500 -> 2.
#   - Selection then finished the job. mae_tolerance_abs is 0.10 and the whole
#     completed spread was 0.035, so ALL 25 completions were lexicographic
#     candidates: the primary metric ranked nothing and the pick was made on
#     pooled CV OU accuracy alone, 51.9% vs 50.6% over 855 games. The winner was
#     trial 4 of 120 -- a depth-1 stump at train_games 3000, which never touched
#     the extra history the cell was built to test.
#
# So the window axis was never measured. This campaign fixes train_games per
# cell instead of tuning it, which is the only way to guarantee coverage: the
# sampler is a hardcoded TPESampler (training_pipeline/tuning.py) with no config
# knob, so "make Optuna spread its trials over the windows" is not expressible.
# Three fixed windows, one deliberate difference between cells, full trial
# budget each.
#
# 3000 is this cell because it is the window cell C actually selected. It is the
# control: if the larger cells do not beat it, the extra seasons earned nothing
# and the production switch stays off.
#
# READ ROI SCEPTICALLY. These cells are evaluated on the primary seed only
# (random_state 16), so no run here carries an error bar of its own. The noise
# floor still exists -- previously measured at 4.9-12.0 ROI points and
# 0.017-0.110 holdout MAE for ONE fixed config, re-fitted under other seeds --
# it is simply no longer being measured per run. Judge cells on holdout MAE,
# which is far less noisy than ROI, and treat any ROI gap under ~5 points as
# indistinguishable. Three cells against that floor means expecting roughly one
# to look good by luck.

experiment_name: winax_d1_window_3000
prediction_strategy: line_error_regressor
training_version: "2.1-window-axis-extended"
comparison_group: window_axis_extended_2026_08
hypothesis: >
  Control cell. At the 3,000-game window -- the one cell C's selection actually
  landed on -- the extended-history data regime performs at the level already
  measured there (holdout MAE ~14.51, ROI negative). This
  cell exists to give D2 and D3 something to be read against at a window the
  sampler is not choosing.
tags: [line_error, window_axis, extended_history, fixed_window, control]

# Hardware, not part of the hypothesis -- device is excluded from fingerprint()
# so it cannot fork an Optuna study. It must still be IDENTICAL on every cell of
# this campaign: trial timing feeds the pruner, so a cell running on different
# hardware is not comparable with one that is not.
#
# VERIFY CUDA IS REAL ON THE MACHINE YOU RUN THIS ON. XGBoost 2.1.4 does not
# error when asked for a device it was not compiled for -- it warns
# "XGBoost is not compiled with CUDA support" and silently runs on CPU, so a run
# can look GPU-configured and take CPU time. The runner checks this first.
device: cuda

data:
  csv_path: data/train_data/training_data_2_0_20260819.csv
  data_version: "20260819-training-2.0"
  expected_checksum: "sha256:27a291de0ae78165"
  # Identical to cell C, and identical across D1/D2/D3: the data regime is held
  # FIXED here so the window is the only thing that differs between cells. The
  # switch resolves to season_year_floor 2019 plus cleaning.max_seasonal_nan_spread
  # 90 and writes both into the recorded config, so config.json shows what ran.
  # Measured on this CSV: 8,279 rows / 1,232 columns.
  extend_history_dropping_season_gated_columns: true

walk_forward:
  # THE window, fixed. Every fit site -- CV folds, the holdout daily
  # walk-forward, and the refit -- uses this one number.
  train_games: 3000
  # MUST be null, explicitly. experiments/_base.yaml sets
  # train_games_choices: [2500, 3000, 3500, 4000] and the merge is a deep merge,
  # so omitting this key does NOT disable window tuning -- it inherits the base
  # list and this cell silently becomes a tuned-window run over the wrong
  # choices, capped at 4000. That is exactly the class of silent no-op this
  # campaign was created to undo, so it is stated rather than assumed.
  train_games_choices: null

optuna:
  # Warmup 0.5 -> 15 of 30 folds (~430 validation games) before the pruner may
  # act, against the base 0.25 -> 8 folds (~240 games). Cell C pruned 94 of 95
  # trials at fold 8 on a 0.035 MAE spread; doubling the evidence a trial must
  # produce before it can be killed is the minimum that makes pruning a decision
  # rather than a coin flip. Costs roughly 2x per pruned trial.
  pruner_warmup_fraction: 0.5
  # 0.02 against the base 0.10. Cell C's entire completed spread was 0.035, so
  # the 0.10 tolerance admitted every single completion as a candidate and the
  # primary metric contributed nothing -- the trial was chosen on CV OU accuracy
  # over 855 games, which is noise at +-3.4 points. 0.02 keeps the tie-break for
  # genuine ties instead of handing it the whole decision.
  mae_tolerance_abs: 0.02
  # Matched across D1/D2/D3. One dimension smaller than cell C's space (the
  # window is fixed now), so 120 buys strictly denser sampling of the model
  # hyperparameters than C got.
  n_trials: 120
  # null, never a duration: a timeout makes trial count a function of how busy
  # the machine is, which silently un-matches cells meant to be comparable.
  timeout: null
